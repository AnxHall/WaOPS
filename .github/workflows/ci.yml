name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @waops/db exec prisma generate

      - name: Lint
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit tests (packages + api repo-level)
        run: |
          pnpm -r --filter './packages/*' run test
          pnpm --filter @waops/api run test
          pnpm --filter @waops/worker run test

  go-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Build (linux)
        working-directory: agent
        run: GOOS=linux go build ./...
      - name: Vet
        working-directory: agent
        run: GOOS=linux go vet ./...
      - name: Test
        working-directory: agent
        run: go test ./...

  # HARD MISSION 05 — supply-chain: dependency security gate + SBOM artifact.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Vulnerability audit (gate)
        # HIGH/CRITICAL fail CI. MODERATE advisories must be listed in
        # scripts/audit-allowlist.txt with justification (supply-chain.md).
        run: node scripts/audit-gate.mjs

      - name: Generate SBOM (CycloneDX)
        run: node scripts/generate-sbom.mjs > sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  integration-e2e:
    runs-on: ubuntu-latest
    needs: [lint-typecheck-unit]
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: waops
          POSTGRES_PASSWORD: waops
          POSTGRES_DB: waops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U waops"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['8025:8025', '1025:1025']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @waops/db exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @waops/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://waops:waops@localhost:5432/waops?schema=public

      - name: Seed
        run: pnpm --filter @waops/db run seed
        env:
          DATABASE_URL: postgresql://waops:waops@localhost:5432/waops?schema=public
          TRIAL_DAYS: '3'

      - name: Seed idempotency (run twice, no duplicates)
        run: pnpm --filter @waops/db run seed
        env:
          DATABASE_URL: postgresql://waops:waops@localhost:5432/waops?schema=public
          TRIAL_DAYS: '3'

      - name: Start services
        # Test port convention (docs/environments/LOCAL_DEVELOPMENT.md): 4000/5000.
        run: |
          pnpm --filter @waops/api run start &
          pnpm --filter @waops/worker run start &
          pnpm --filter @waops/collector-gateway run start &
          sleep 8
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://waops:waops@localhost:5432/waops?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
          ENCRYPTION_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SMTP_HOST: localhost
          SMTP_PORT: '1025'
          E2E_MAILPIT_URL: http://localhost:8025
          PORT: '4000'
          COLLECTOR_PORT: '5000'

      - name: E2E full flow
        run: pnpm --filter @waops/api run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://waops:waops@localhost:5432/waops?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
          ENCRYPTION_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          E2E_API_URL: http://localhost:4000
          E2E_GATEWAY_URL: http://localhost:5000
          E2E_MAILPIT_URL: http://localhost:8025

      - name: Migration drift check
        run: pnpm --filter @waops/db exec prisma migrate diff --from-url "postgresql://waops:waops@localhost:5432/waops?schema=public" --to-schema-datamodel packages/db/prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://waops:waops@localhost:5432/waops?schema=public
