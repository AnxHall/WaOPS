# HARD MISSION 05 — supply-chain: dependency updates + vulnerability scanning.
# Weekly pnpm ecosystem updates; grouping keeps PR noise manageable.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Next major bumps are deliberate missions, not dependabot chores.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/agent"
    schedule:
      interval: "weekly"
