packages:
  - "apps/*"
  - "packages/*"
  - "agent"

# HARD MISSION 05 — supply-chain: force patched transitive versions.
# postcss <8.5.28: GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849 (HIGH) via next@15.
# deepmerge-ts <8.0.0: GHSA-ggr8-5vv4-36mx (HIGH, CVE-2026-40345) via @prisma/config.
overrides:
  postcss: ^8.5.28
  deepmerge-ts: ^8.0.0

allowBuilds:
  argon2: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  "@swc/core": true
  msgpackr-extract: true
  unrs-resolver: true
